<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>첫장 에디터</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --panel: #181818;
  --panel2: #1f1f1f;
  --border: #282828;
  --input-bg: #111;
  --accent: #FBF2A7;
  --muted: #555;
  --dim: #888;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  height: 100%;
  background: #0d0d0d;
  color: #fff;
  font-family: 'Noto Sans KR', sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden; /* 전체 페이지 스크롤 없음 */
}

/* ══ HEADER ══════════════════════════════════ */
header {
  flex-shrink: 0;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  z-index: 10;
}
.site-title {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: -0.04em;
  color: var(--accent);
}
.hdr-btns { display: flex; gap: 8px; }
.btn-reset {
  background: #252525;
  color: #aaa;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 6px 12px;
  font: 700 11px/1 'Noto Sans KR', sans-serif;
  cursor: pointer;
  letter-spacing: -0.02em;
  transition: background .15s;
}
.btn-reset:hover { background: #2e2e2e; color: #fff; }
.btn-dl {
  background: var(--accent);
  color: #111;
  border: none;
  border-radius: 6px;
  padding: 6px 14px;
  font: 900 11px/1 'Noto Sans KR', sans-serif;
  cursor: pointer;
  letter-spacing: -0.02em;
  transition: background .15s;
}
.btn-dl:hover { background: #f0e580; }
.btn-dl:disabled { opacity: .6; cursor: default; }

/* ══ BODY SPLIT ══════════════════════════════ */
.body-wrap {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
}

/* ══ LEFT PANEL ══════════════════════════════ */
.panel {
  width: 260px;
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 14px 14px 32px;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.panel::-webkit-scrollbar { width: 3px; }
.panel::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

/* 패널 섹션 카드 */
.p-card {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
}
.p-card:last-child { margin-bottom: 0; }

.sec-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
.field:last-child { margin-bottom: 0; }
.field label { font-size: 10px; color: var(--dim); }

input[type="text"] {
  background: var(--input-bg);
  border: 1px solid #2a2a2a;
  border-radius: 5px;
  color: #fff;
  font-family: inherit;
  font-size: 12px;
  padding: 7px 9px;
  outline: none;
  width: 100%;
  transition: border-color .2s;
}
input[type="text"]:focus { border-color: var(--accent); }

input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
  cursor: pointer;
  height: 3px;
}

.row { display: flex; align-items: center; gap: 6px; }
.row input[type="range"] { flex: 1; }
.val { font-size: 10px; color: var(--muted); width: 32px; text-align: right; flex-shrink: 0; }

/* 업로드 존 */
.upload-zone {
  border: 1.5px dashed #2e2e2e;
  border-radius: 8px;
  padding: 14px 10px;
  text-align: center;
  cursor: pointer;
  position: relative;
  transition: border-color .2s, background .2s;
}
.upload-zone:hover { border-color: var(--accent); background: #1a1a1a; }
.upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.upload-zone .ico { font-size: 18px; margin-bottom: 3px; }
.upload-zone p { font-size: 10px; color: #444; line-height: 1.4; }
.upload-zone.ok p { color: var(--accent); }

/* 색상 스와치 */
.color-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 5px;
}
.swatch {
  aspect-ratio: 1;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform .15s, border-color .15s;
}
.swatch:hover { transform: scale(1.15); }
.swatch.active {
  border-color: #fff;
  box-shadow: 0 0 0 1px rgba(255,255,255,.3);
  transform: scale(1.18);
}

/* 구분선 */
.divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }

/* ══ PREVIEW ══════════════════════════════════ */
.preview-area {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0a0a0a;
  overflow: hidden;
  position: relative;
}

.scale-wrap {
  transform-origin: center center;
  /* 실제 크기로 존재, transform으로만 줄임 */
  flex-shrink: 0;
}

/* ══ CARD 1080×1350 ══════════════════════════ */
#card {
  position: relative;
  width: 1080px;
  height: 1350px;
  background: #fff;
  overflow: hidden;
}

#bg-img {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-color: #1e1e1e;
}

#grad-overlay {
  position: absolute;
  width: 1240.67px;
  height: 1829.38px;
  left: calc(50% - 620.335px + 76.34px);
  top: -479px;
  background:
    linear-gradient(0deg, rgba(0,0,0,.3), rgba(0,0,0,.3)),
    linear-gradient(180.01deg, rgba(0,0,0,.8) 25.03%, rgba(102,102,102,0) 77%);
  transform: rotate(179.86deg);
  pointer-events: none;
}

#tag-box {
  position: absolute;
  display: flex;
  align-items: center;
  padding: 12px 36px;
  left: 106px;
  top: 870px;
  background: #fff;
}
#tag-text {
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 700;
  font-size: 50px;
  line-height: 1.2;
  letter-spacing: -0.05em;
  color: #000;
  white-space: nowrap;
}

#sub-text {
  position: absolute;
  left: 106px;
  top: 990px;
  width: 795px;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 400;
  font-size: 75px;
  line-height: 1.2;
  letter-spacing: -0.05em;
  color: #fff;
  text-shadow: 0 -4px 50px #000;
}

#main-text {
  position: absolute;
  left: 106px;
  top: 1089px;
  width: 946px;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 900;
  font-size: 130px;
  line-height: 1.2;
  letter-spacing: -0.05em;
  color: #FBF2A7;
  text-shadow: 0 -4px 50px #000;
  word-break: keep-all;
}

#logo-name {
  position: absolute;
  right: 56px;
  bottom: 48px;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.02em;
  color: #fff;
  text-shadow: 0 0 24px rgba(0,0,0,.9);
  white-space: nowrap;
}

/* ══ MOBILE ══════════════════════════════════ */
.mobile-bar {
  display: none;
  flex-shrink: 0;
  flex-direction: column;
  background: var(--panel);
  border-top: 1px solid var(--border);
  z-index: 10;
}
.tab-row {
  display: flex;
  border-bottom: 1px solid var(--border);
}
.tab-btn {
  flex: 1;
  padding: 9px 2px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font: 700 10px/1 'Noto Sans KR', sans-serif;
  cursor: pointer;
  transition: color .15s;
}
.tab-btn.on { color: var(--accent); border-bottom-color: var(--accent); }
.tab-pane {
  display: none;
  padding: 12px 14px 16px;
  max-height: 38vh;
  overflow-y: auto;
}
.tab-pane.on { display: block; }

@media (max-width: 760px) {
  .panel { display: none; }
  .mobile-bar { display: flex; }
  body { overflow: hidden; }
  .preview-area { align-items: flex-start; padding-top: 16px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <span class="site-title">첫장 에디터</span>
  <div class="hdr-btns">
    <button class="btn-reset" id="btn-reset">↺ 초기화</button>
    <button class="btn-dl" id="btn-dl">⬇ PNG 저장</button>
  </div>
</header>

<div class="body-wrap">

  <!-- LEFT PANEL (PC) -->
  <aside class="panel" id="pc-panel">

    <!-- 배경 이미지 -->
    <div class="p-card">
      <p class="sec-label">배경 이미지</p>
      <div class="upload-zone" id="upload-zone">
        <input type="file" accept="image/*" id="bg-file">
        <div class="ico">🖼️</div>
        <p id="upload-hint">클릭하거나 드래그</p>
      </div>
    </div>

    <!-- 텍스트 -->
    <div class="p-card">
      <p class="sec-label">텍스트</p>
      <div class="field">
        <label>태그 박스 (흰 배경 · 검정)</label>
        <input type="text" id="inp-tag" value="문장 구조, 이렇게 보는 거였어?">
      </div>
      <div class="field">
        <label>부제목 (흰 글씨)</label>
        <input type="text" id="inp-sub" value="편입 영어 노베이스를 위한">
      </div>
      <div class="field">
        <label>우하단 브랜드명</label>
        <input type="text" id="inp-logo" value="아이딜리">
      </div>
    </div>

    <!-- 메인 타이틀 + 색상 (묶음) -->
    <div class="p-card">
      <p class="sec-label">메인 타이틀</p>
      <div class="field">
        <label>텍스트</label>
        <input type="text" id="inp-main" value="쌩기초 영문법">
      </div>
      <div class="field">
        <label>색상</label>
        <div class="color-grid" id="color-grid-pc"></div>
      </div>
    </div>

    <!-- 폰트 크기 -->
    <div class="p-card">
      <p class="sec-label">폰트 크기</p>
      <div class="field">
        <label>태그 박스</label>
        <div class="row"><input type="range" id="fs-tag" min="24" max="70" value="50"><span class="val" id="v-fs-tag">50px</span></div>
      </div>
      <div class="field">
        <label>부제목</label>
        <div class="row"><input type="range" id="fs-sub" min="36" max="110" value="75"><span class="val" id="v-fs-sub">75px</span></div>
      </div>
      <div class="field">
        <label>메인 타이틀</label>
        <div class="row"><input type="range" id="fs-main" min="60" max="180" value="130"><span class="val" id="v-fs-main">130px</span></div>
      </div>
      <div class="field">
        <label>브랜드명</label>
        <div class="row"><input type="range" id="fs-logo" min="12" max="44" value="22"><span class="val" id="v-fs-logo">22px</span></div>
      </div>
    </div>

    <!-- 위치 -->
    <div class="p-card">
      <p class="sec-label">세로 위치</p>
      <div class="field">
        <label>태그 박스</label>
        <div class="row"><input type="range" id="pos-tag" min="600" max="1150" value="870"><span class="val" id="v-pos-tag">870px</span></div>
      </div>
      <div class="field">
        <label>부제목</label>
        <div class="row"><input type="range" id="pos-sub" min="700" max="1200" value="990"><span class="val" id="v-pos-sub">990px</span></div>
      </div>
      <div class="field">
        <label>메인 타이틀</label>
        <div class="row"><input type="range" id="pos-main" min="800" max="1280" value="1089"><span class="val" id="v-pos-main">1089px</span></div>
      </div>
    </div>

    <!-- 오버레이 -->
    <div class="p-card">
      <p class="sec-label">오버레이 어둡기</p>
      <div class="row"><input type="range" id="ov-str" min="0" max="100" value="100"><span class="val" id="v-ov">100%</span></div>
    </div>

  </aside>

  <!-- PREVIEW -->
  <main class="preview-area" id="preview-area">
    <div class="scale-wrap" id="scale-wrap">
      <div id="card">
        <div id="bg-img"></div>
        <div id="grad-overlay"></div>
        <div id="tag-box"><span id="tag-text">문장 구조, 이렇게 보는 거였어?</span></div>
        <div id="sub-text">편입 영어 노베이스를 위한</div>
        <div id="main-text">쌩기초 영문법</div>
        <div id="logo-name">아이딜리</div>
      </div>
    </div>
  </main>
</div>

<!-- MOBILE BAR -->
<div class="mobile-bar">
  <div class="tab-row">
    <button class="tab-btn on" data-tab="m-img">🖼️ 이미지</button>
    <button class="tab-btn" data-tab="m-text">✏️ 텍스트</button>
    <button class="tab-btn" data-tab="m-main">🔤 타이틀</button>
    <button class="tab-btn" data-tab="m-style">🎨 스타일</button>
    <button class="tab-btn" data-tab="m-pos">📐 위치</button>
  </div>
  <div id="m-img" class="tab-pane on">
    <div class="upload-zone" id="m-upload-zone">
      <input type="file" accept="image/*" id="m-bg-file">
      <div class="ico">🖼️</div>
      <p id="m-upload-hint">클릭하거나 드래그</p>
    </div>
  </div>
  <div id="m-text" class="tab-pane">
    <div class="field"><label>태그 박스</label><input type="text" id="m-inp-tag" value="문장 구조, 이렇게 보는 거였어?"></div>
    <div class="field"><label>부제목</label><input type="text" id="m-inp-sub" value="편입 영어 노베이스를 위한"></div>
    <div class="field"><label>브랜드명</label><input type="text" id="m-inp-logo" value="아이딜리"></div>
  </div>
  <div id="m-main" class="tab-pane">
    <div class="field"><label>메인 타이틀 텍스트</label><input type="text" id="m-inp-main" value="쌩기초 영문법"></div>
    <div class="field" style="margin-top:8px"><label>색상</label><div class="color-grid" id="color-grid-m"></div></div>
  </div>
  <div id="m-style" class="tab-pane">
    <div class="field"><label>태그 폰트</label><div class="row"><input type="range" id="m-fs-tag" min="24" max="70" value="50"><span class="val" id="m-v-fs-tag">50px</span></div></div>
    <div class="field"><label>부제목 폰트</label><div class="row"><input type="range" id="m-fs-sub" min="36" max="110" value="75"><span class="val" id="m-v-fs-sub">75px</span></div></div>
    <div class="field"><label>타이틀 폰트</label><div class="row"><input type="range" id="m-fs-main" min="60" max="180" value="130"><span class="val" id="m-v-fs-main">130px</span></div></div>
    <div class="field"><label>브랜드명 폰트</label><div class="row"><input type="range" id="m-fs-logo" min="12" max="44" value="22"><span class="val" id="m-v-fs-logo">22px</span></div></div>
    <div class="divider"></div>
    <div class="field"><label>오버레이</label><div class="row"><input type="range" id="m-ov-str" min="0" max="100" value="100"><span class="val" id="m-v-ov">100%</span></div></div>
  </div>
  <div id="m-pos" class="tab-pane">
    <div class="field"><label>태그 박스 위치</label><div class="row"><input type="range" id="m-pos-tag" min="600" max="1150" value="870"><span class="val" id="m-v-pos-tag">870px</span></div></div>
    <div class="field"><label>부제목 위치</label><div class="row"><input type="range" id="m-pos-sub" min="700" max="1200" value="990"><span class="val" id="m-v-pos-sub">990px</span></div></div>
    <div class="field"><label>타이틀 위치</label><div class="row"><input type="range" id="m-pos-main" min="800" max="1280" value="1089"><span class="val" id="m-v-pos-main">1089px</span></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const $ = id => document.getElementById(id);

const COLORS = [
  { name:'빨', hex:'#FF3B3B' },
  { name:'주', hex:'#FF8C00' },
  { name:'노', hex:'#FBF2A7' },
  { name:'초', hex:'#4CD964' },
  { name:'파', hex:'#3B8BFF' },
  { name:'남', hex:'#3B3BFF' },
  { name:'보', hex:'#AF52DE' },
  { name:'흰', hex:'#FFFFFF' },
];
const DEFAULTS = {
  tag:'문장 구조, 이렇게 보는 거였어?', sub:'편입 영어 노베이스를 위한',
  main:'쌩기초 영문법', logo:'아이딜리',
  fsTag:50, fsSub:75, fsMain:130, fsLogo:22,
  posTag:870, posSub:990, posMain:1089,
  overlay:100, color:'#FBF2A7'
};
let curColor = DEFAULTS.color;

/* ── 색상 스와치 렌더 ── */
function renderSwatches(gridId) {
  const g = $(gridId);
  if (!g) return;
  g.innerHTML = COLORS.map(c => `
    <div class="swatch${c.hex===curColor?' active':''}"
      style="background:${c.hex};${c.hex==='#FFFFFF'?'border-color:#444;':''}"
      data-color="${c.hex}" title="${c.name}"></div>
  `).join('');
  g.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      curColor = sw.dataset.color;
      $('main-text').style.color = curColor;
      renderSwatches('color-grid-pc');
      renderSwatches('color-grid-m');
    });
  });
}

/* ── 스케일 ── */
function scaleCard() {
  const pa = $('preview-area');
  const W = pa.clientWidth, H = pa.clientHeight;
  const pad = 32;
  const scale = Math.min((W - pad) / 1080, (H - pad) / 1350);
  const sw = $('scale-wrap');
  sw.style.transform = `scale(${scale})`;
  // scale-wrap 실제 점유 공간 보정 (transform은 레이아웃 공간 유지)
  sw.style.width  = 1080 + 'px';
  sw.style.height = 1350 + 'px';
  sw.style.marginLeft  = ((1080 * scale - 1080) / 2) + 'px';
  sw.style.marginTop   = ((1350 * scale - 1350) / 2) + 'px';
  sw.style.marginRight  = ((1080 * scale - 1080) / 2) + 'px';
  sw.style.marginBottom = ((1350 * scale - 1350) / 2) + 'px';
}

/* ── 슬라이더 바인딩 ── */
function sl(id, vid, fn) {
  const el = $(id); if (!el) return;
  el.addEventListener('input', function() {
    const vEl = $(vid); if (vEl) vEl.textContent = this.value + 'px';
    fn(this.value);
  });
}
function slPct(id, vid, fn) {
  const el = $(id); if (!el) return;
  el.addEventListener('input', function() {
    const vEl = $(vid); if (vEl) vEl.textContent = this.value + '%';
    fn(this.value);
  });
}

function bindAll() {
  // 텍스트 (PC)
  bind('inp-tag',  v => $('tag-text').textContent  = v);
  bind('inp-sub',  v => $('sub-text').textContent  = v);
  bind('inp-main', v => $('main-text').textContent = v);
  bind('inp-logo', v => $('logo-name').textContent = v);
  // 텍스트 (Mobile) — 동기화
  bindM('m-inp-tag',  'inp-tag',  v => $('tag-text').textContent  = v);
  bindM('m-inp-sub',  'inp-sub',  v => $('sub-text').textContent  = v);
  bindM('m-inp-main', 'inp-main', v => $('main-text').textContent = v);
  bindM('m-inp-logo', 'inp-logo', v => $('logo-name').textContent = v);

  // 폰트 (PC)
  sl('fs-tag',  'v-fs-tag',  v => { $('tag-text').style.fontSize  = v+'px'; sync('m-fs-tag','m-v-fs-tag',v); });
  sl('fs-sub',  'v-fs-sub',  v => { $('sub-text').style.fontSize  = v+'px'; sync('m-fs-sub','m-v-fs-sub',v); });
  sl('fs-main', 'v-fs-main', v => { $('main-text').style.fontSize = v+'px'; sync('m-fs-main','m-v-fs-main',v); });
  sl('fs-logo', 'v-fs-logo', v => { $('logo-name').style.fontSize = v+'px'; sync('m-fs-logo','m-v-fs-logo',v); });
  // 폰트 (Mobile)
  sl('m-fs-tag',  'm-v-fs-tag',  v => { $('tag-text').style.fontSize  = v+'px'; sync('fs-tag','v-fs-tag',v); });
  sl('m-fs-sub',  'm-v-fs-sub',  v => { $('sub-text').style.fontSize  = v+'px'; sync('fs-sub','v-fs-sub',v); });
  sl('m-fs-main', 'm-v-fs-main', v => { $('main-text').style.fontSize = v+'px'; sync('fs-main','v-fs-main',v); });
  sl('m-fs-logo', 'm-v-fs-logo', v => { $('logo-name').style.fontSize = v+'px'; sync('fs-logo','v-fs-logo',v); });

  // 위치 (PC)
  sl('pos-tag',  'v-pos-tag',  v => { $('tag-box').style.top   = v+'px'; sync('m-pos-tag','m-v-pos-tag',v); });
  sl('pos-sub',  'v-pos-sub',  v => { $('sub-text').style.top  = v+'px'; sync('m-pos-sub','m-v-pos-sub',v); });
  sl('pos-main', 'v-pos-main', v => { $('main-text').style.top = v+'px'; sync('m-pos-main','m-v-pos-main',v); });
  // 위치 (Mobile)
  sl('m-pos-tag',  'm-v-pos-tag',  v => { $('tag-box').style.top   = v+'px'; sync('pos-tag','v-pos-tag',v); });
  sl('m-pos-sub',  'm-v-pos-sub',  v => { $('sub-text').style.top  = v+'px'; sync('pos-sub','v-pos-sub',v); });
  sl('m-pos-main', 'm-v-pos-main', v => { $('main-text').style.top = v+'px'; sync('pos-main','v-pos-main',v); });

  // 오버레이 (PC)
  slPct('ov-str', 'v-ov', v => { applyOverlay(v); sync('m-ov-str','m-v-ov',v,true); });
  slPct('m-ov-str', 'm-v-ov', v => { applyOverlay(v); sync('ov-str','v-ov',v,true); });

  // 배경
  bindFile('bg-file');
  bindFile('m-bg-file');

  // 드래그
  ['upload-zone','m-upload-zone'].forEach(id => {
    const uz = $(id); if (!uz) return;
    uz.addEventListener('dragover', e => { e.preventDefault(); uz.style.borderColor='#FBF2A7'; });
    uz.addEventListener('dragleave', () => uz.style.borderColor='#2e2e2e');
    uz.addEventListener('drop', e => { e.preventDefault(); uz.style.borderColor='#2e2e2e'; loadBg(e.dataTransfer.files[0]); });
  });
}

function bind(id, fn) {
  const el = $(id); if (!el) return;
  el.addEventListener('input', e => fn(e.target.value));
}
function bindM(mid, pcId, fn) {
  const el = $(mid); if (!el) return;
  el.addEventListener('input', e => {
    fn(e.target.value);
    const pc = $(pcId); if (pc) pc.value = e.target.value;
  });
  // PC→Mobile 동기화
  const pc = $(pcId); if (!pc) return;
  pc.addEventListener('input', e => { el.value = e.target.value; });
}
function sync(id, vid, v, isPct=false) {
  const el = $(id); if (el) el.value = v;
  const vEl = $(vid); if (vEl) vEl.textContent = v + (isPct?'%':'px');
}
function bindFile(id) {
  const el = $(id); if (!el) return;
  el.addEventListener('change', e => loadBg(e.target.files[0]));
}
function applyOverlay(v) {
  const t = v / 100;
  $('grad-overlay').style.background = `
    linear-gradient(0deg,rgba(0,0,0,${.3*t}),rgba(0,0,0,${.3*t})),
    linear-gradient(180.01deg,rgba(0,0,0,${.8*t}) 25.03%,rgba(102,102,102,0) 77%)
  `;
}

function loadBg(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const r = new FileReader();
  r.onload = ev => {
    $('bg-img').style.backgroundImage = `url(${ev.target.result})`;
    ['upload-zone','m-upload-zone'].forEach(id => { const el=$(id); if(el) el.classList.add('ok'); });
    ['upload-hint','m-upload-hint'].forEach(id => { const el=$(id); if(el) el.textContent='✅ '+file.name; });
  };
  r.readAsDataURL(file);
}

/* ── 초기화 ── */
function resetAll() {
  $('tag-text').textContent  = DEFAULTS.tag;
  $('sub-text').textContent  = DEFAULTS.sub;
  $('main-text').textContent = DEFAULTS.main;
  $('logo-name').textContent = DEFAULTS.logo;

  ['inp-tag','m-inp-tag'].forEach(id=>{const e=$(id);if(e)e.value=DEFAULTS.tag;});
  ['inp-sub','m-inp-sub'].forEach(id=>{const e=$(id);if(e)e.value=DEFAULTS.sub;});
  ['inp-main','m-inp-main'].forEach(id=>{const e=$(id);if(e)e.value=DEFAULTS.main;});
  ['inp-logo','m-inp-logo'].forEach(id=>{const e=$(id);if(e)e.value=DEFAULTS.logo;});

  $('tag-text').style.fontSize  = DEFAULTS.fsTag+'px';
  $('sub-text').style.fontSize  = DEFAULTS.fsSub+'px';
  $('main-text').style.fontSize = DEFAULTS.fsMain+'px';
  $('logo-name').style.fontSize = DEFAULTS.fsLogo+'px';

  $('tag-box').style.top   = DEFAULTS.posTag+'px';
  $('sub-text').style.top  = DEFAULTS.posSub+'px';
  $('main-text').style.top = DEFAULTS.posMain+'px';

  curColor = DEFAULTS.color;
  $('main-text').style.color = curColor;

  $('bg-img').style.backgroundImage = '';
  ['upload-zone','m-upload-zone'].forEach(id=>{const e=$(id);if(e)e.classList.remove('ok');});
  ['upload-hint','m-upload-hint'].forEach(id=>{const e=$(id);if(e)e.textContent='클릭하거나 드래그';});

  applyOverlay(DEFAULTS.overlay);

  // 슬라이더 값 리셋
  [['fs-tag',DEFAULTS.fsTag,'v-fs-tag'],['fs-sub',DEFAULTS.fsSub,'v-fs-sub'],
   ['fs-main',DEFAULTS.fsMain,'v-fs-main'],['fs-logo',DEFAULTS.fsLogo,'v-fs-logo'],
   ['pos-tag',DEFAULTS.posTag,'v-pos-tag'],['pos-sub',DEFAULTS.posSub,'v-pos-sub'],
   ['pos-main',DEFAULTS.posMain,'v-pos-main'],
   ['m-fs-tag',DEFAULTS.fsTag,'m-v-fs-tag'],['m-fs-sub',DEFAULTS.fsSub,'m-v-fs-sub'],
   ['m-fs-main',DEFAULTS.fsMain,'m-v-fs-main'],['m-fs-logo',DEFAULTS.fsLogo,'m-v-fs-logo'],
   ['m-pos-tag',DEFAULTS.posTag,'m-v-pos-tag'],['m-pos-sub',DEFAULTS.posSub,'m-v-pos-sub'],
   ['m-pos-main',DEFAULTS.posMain,'m-v-pos-main'],
  ].forEach(([id,val,vid])=>{
    const e=$(id); if(e) e.value=val;
    const v=$(vid); if(v) v.textContent=val+'px';
  });
  [['ov-str',DEFAULTS.overlay,'v-ov'],['m-ov-str',DEFAULTS.overlay,'m-v-ov']].forEach(([id,val,vid])=>{
    const e=$(id); if(e) e.value=val;
    const v=$(vid); if(v) v.textContent=val+'%';
  });

  renderSwatches('color-grid-pc');
  renderSwatches('color-grid-m');
}

/* ── 다운로드 ── */
$('btn-dl').addEventListener('click', async () => {
  const btn = $('btn-dl');
  btn.textContent = '⏳...'; btn.disabled = true;

  const sw = $('scale-wrap');
  const prevT = sw.style.transform;
  sw.style.transform = 'scale(1)';
  sw.style.margin = '0';
  await new Promise(r => setTimeout(r, 100));

  try {
    const canvas = await html2canvas($('card'), {
      scale: 2, useCORS: true, allowTaint: true,
      backgroundColor: '#ffffff', width: 1080, height: 1350, logging: false,
    });
    const a = document.createElement('a');
    a.download = '첫장_카드뉴스.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  } catch(e) { alert('오류: '+e.message); }

  scaleCard();
  btn.textContent = '⬇ PNG 저장'; btn.disabled = false;
});

$('btn-reset').addEventListener('click', () => {
  if (confirm('기본값으로 초기화할까요?')) resetAll();
});

/* ── 모바일 탭 ── */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('on'));
    btn.classList.add('on');
    $(btn.dataset.tab).classList.add('on');
  });
});

/* ── resize ── */
window.addEventListener('resize', scaleCard);

/* ── init ── */
renderSwatches('color-grid-pc');
renderSwatches('color-grid-m');
bindAll();
scaleCard();
</script>
</body>
</html>
